<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/u_mat.png" />
<link rel="shortcut icon" type="image/png" href="/u_mat.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <!-- PWA Support -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UMaT Library">
<link rel="apple-touch-icon" href="/u_mat.png">

<!-- Register Service Worker with auto-update -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        // Check for updates every 30 minutes
        setInterval(() => reg.update(), 30 * 60 * 1000);
      }).catch(err => console.log('Service Worker failed:', err));

      // When a new version is found, reload once to load fresh files
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
